name: Validate profile repository

on:
  pull_request:
    paths:
      - README.md
      - .github/workflows/**
      - assets/**
      - scripts/validate_profile.py
      - tests/test_validate_profile.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Validate README references and SVG files
        run: python scripts/validate_profile.py

      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v
